# OneClick AI: protect local models and Python implementation.
location ^~ /app/oneclick/models/ { return 404; }
location ~ ^/app/oneclick/api/.*\.py$ { return 404; }
location = /app/oneclick/api/process.php {
  include fastcgi_params;
  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
  fastcgi_param HTTPS on;
  fastcgi_param SERVER_PORT 443;
  fastcgi_param PHP_VALUE "memory_limit=512M\nmax_execution_time=300\npost_max_size=32M\ndisplay_errors=off";
  fastcgi_pass 127.0.0.1:18001;
  fastcgi_read_timeout 300s;
  fastcgi_intercept_errors off;
  client_max_body_size 32m;
}
